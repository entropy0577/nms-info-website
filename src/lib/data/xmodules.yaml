    note: X-class only (no S-class version). Each roll is usually +2%; +10% is the maximum.
    stats:
      - {stat: Heat Resistance, x: [1, 10]}
      - {stat: Cold Resistance, x: [1, 10]}
      - {stat: Radiation Resistance, x: [1, 10]}
      - {stat: Toxic Resistance, x: [1, 10]}

xNoVersion: [Exocraft upgrades, Fusion Engine, Daedalus Engine, Humboldt Drive, Minotaur upgrades, Thermal / Radiation / Toxic Protection (use Illegal Hazard Protection instead), Underwater Oxygen]

xSources:
  - Suspicious Packet (Tech) — Scrap Dealer on space stations (~320 Tainted Metal), or ~74,000 units in outlaw systems.
  - Suspicious Packet (Arms) — Scrap Dealer (~300 Tainted Metal), ~130,000 units in outlaw systems, or from killing pirates.
  - Buried caches and some ships you meet on planets.
  - Tainted Metal comes from derelict freighters; you can also sell Crew Manifests and Captain's Logs to the Scrap Dealer.

xRollTips:
  - "X-class stats roll from a very wide range: often worse than A-class, occasionally better than any S-class. Only keep rolls above the S-class max."
  - X modules also roll a random number of stats, sometimes just one — and some roll nothing at all.
  - "Stats are fixed by a save seed, not when you buy: the same module installed in the same position of your install order always gives the same result."
  - "To reroll: save (e.g. get in and out of your ship), install the X module, and check it. If it's bad, reload, install and dismantle any cheap C-class module first, then install the X module again — it will roll differently."
  - Dismantling a module does not change the seed, so you can remove a weaker module before installing a new one.
  - You can only have three upgrades of one family installed (per inventory tab for the exosuit). X modules count toward that limit; place them next to related tech for the adjacency bonus.
