    drawn: {s: 2 + 4, x: 2 + 2–4}
    note: Jetpack Tanks and Initial Boost Power are always rolled; the rest are drawn at random.
    stats:
      - {stat: Jetpack Tanks, s: [200, 235], x: [100, 240], key: true}
      - {stat: Initial Boost Power, s: [5, 15], x: [1, 20]}
      - {stat: Fuel Efficiency, s: [15, 25], x: [10, 30]}
      - {stat: Recharge Rate, s: [15, 35], x: [5, 40]}
      - {stat: Sprint Distance, s: [40, 50], x: [10, 60]}
      - {stat: Sprint Recovery Time, dir: less, s: [30, 50], x: [1, 60]}
  - name: Life Support
    device: Exosuit
    packet: Tech
    drawn: {s: "2", x: 1–2}
    stats:
      - {stat: Life Support Tanks, s: [50, 100], x: [0, 110], key: true}
      - {stat: Solar Panel Power, s: [25, 50], x: [0, 75]}
  - name: Defence Systems (Shield)
    device: Exosuit
    packet: Tech
    drawn: {s: "2", x: 1–2}
