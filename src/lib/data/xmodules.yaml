# X-class (Suspicious) upgrade module roll ranges, compared with S-class.
# Source: No Man's Sky community wiki, each "<Tech> Upgrade" page's class min/max table (Category:Procedural Upgrades), Nov 2026.
# s / x = [min, max] for S-class and X-class. Values are % bonuses unless `unit` says otherwise.
# Negative-direction stats (e.g. reload time, launch cost) are stored as positive "reduction" amounts with dir: 'less'.
# `drawn` = how many stats the module rolls (S-class vs X-class).

xFamilies:
  # ───────── Starship ─────────
  - name: Hyperdrive
    device: Starship
    packet: Tech
    drawn: {s: "2", x: 1–2}
    stats:
      - {stat: Hyperdrive Range, unit: " ly", s: [220, 265], x: [50, 320], key: true}
      - {stat: Warp Cell Efficiency, s: [100, 100], x: [100, 100]}
  - name: Pulse Engine
    device: Starship
    packet: Tech
    drawn: {s: "3", x: 2–3}
    stats:
      - {stat: Boost, s: [10, 25], x: [1, 30], key: true}
      - {stat: Boost Maneuverability, s: [5, 18], x: [1, 20]}
      - {stat: Pulse Drive Fuel Efficiency, s: [20, 20], x: [5, 25]}
      - {stat: Maneuverability, unit: "", s: [0.65, 0.65], x: [0.65, 0.65]}
  - name: Launch Thruster
    device: Starship
    packet: null
    drawn: {s: 1–2, x: 1–2}
    stats: [{stat: Launch Cost, dir: less, s: [20, 20], x: [5, 25], key: true}, {stat: Boost, s: [8, 10], x: [0, 10]}]
  - name: Deflector Shield
    device: Starship
    packet: Tech
    drawn: {s: "1", x: "1"}
    stats: [{stat: Shield Strength, s: [30, 30], x: [7, 40], key: true}]
  - name: Photon Cannon
    device: Starship
    packet: Arms
    drawn: {s: "3", x: 1–3}
    stats:
      - {stat: Damage, s: [20, 28], x: [8, 32], key: true}
      - {stat: Heat Dispersion, s: [3, 3], x: [0, 4]}
      - {stat: Fire Rate, s: [3, 3], x: [0, 3]}
  - name: Phase Beam
    device: Starship
    packet: Arms
    drawn: {s: "2", x: 1–2}
    stats: [{stat: Damage, s: [24, 27], x: [12, 31], key: true}, {stat: Heat Dispersion, s: [75, 95], x: [10, 100]}]
  - name: Positron Ejector
    device: Starship
    packet: Arms
    drawn: {s: "3", x: 2–3}
    stats:
      - {stat: Fire Rate, s: [6, 10], x: [5, 10]}
      - {stat: Heat Dispersion, s: [6, 10], x: [1, 10]}
      - {stat: Damage, s: [2, 2], x: [1, 2], key: true}
  - name: Infra-Knife Accelerator
    device: Starship
    packet: Arms
    drawn: {s: "3", x: 1–3}
    stats:
      - {stat: Damage, s: [4, 5], x: [1, 6], key: true}
      - {stat: Fire Rate, s: [5, 10], x: [1, 15]}
