claimCost:
  Gek: 3 GekNip
  Korvax: 3 Convergence Cube
  Vy'keen: 3 Vy'keen Dagger
  Autophage: Invitation after "They Who Returned", or a Settlement Chart (1,499 Void Motes)

buildings:
  - {name: Overseer's Office, role: Administration, effect: "Unlocks settlement management, Settlement Administration Terminal and a Base Teleport Module."}
  - {name: Farm, role: Agriculture, effect: Strong productivity for modest upkeep. Unlocks crop production as it is upgraded.}
  - {name: Warehouse / Utility Module, role: Industrial, effect: Strong productivity. Unlocks industrial production (the most valuable outputs).}
  - {name: Saloon, role: Leisure, effect: Raises happiness. Unlocks leisure production. Has a Nutrient Processor.}
  - {name: Marketplace, role: Commercial, effect: "Productivity. Unlocks commercial production. May host a Trade Terminal, Tech Merchant or Guild Envoy."}
  - {name: Starport / Stardock, role: Starport, effect: Productivity (but high upkeep). Unlocks starport production. Ship trading and scrapping.}
  - {name: Factory, role: Industrial, effect: Industrial production variety; Multi-Tool cabinet.}
  - {name: Tower, role: Utility, effect: Small contribution. Navigation Data and scanning at higher classes.}
  - {name: Fishing Pond, role: Leisure, effect: Fishing spot; better catches as it is upgraded.}
  - {name: Residence, role: Housing, effect: Raises population cap only.}

officeSteps: [Supply about 210 Silicate Powder or Ferrite Dust (90 s wait)., Supply 5 Metal Plating (90 s wait)., Supply 3 Microprocessors (90 s wait).]

settlementTips:
  - Production pauses while the settlement is in debt. Clear the debt first, then pick your two outputs at the Administration Terminal.
  - "Output is in batches: nothing is collectable until a whole batch finishes. How long a batch takes varies with the settlement's productivity and its maintenance cost; Gek batches are much faster than other species' (Gek times are listed in \"GPT\" units)."
  - Collecting resets the production timer, so collect right after a batch completes, not halfway through.
  - Going into debt (any settlement payment) resets the timer and loses uncollected goods.
  - "A fast way out of debt: upgrade two Farms to S-class and one Warehouse to A-class. Their materials can all be bought or made from Atmosphere Harvester gases."
  - "Most valuable single output: Korvax Quantum Processor (4.4M per batch) or Vy'keen Portable Reactor (4.2M). Combine them with Geodesite to craft Fusion Ignitors (15.6M each)."
  - Hopper capacity is 999 for materials and one inventory stack for items (e.g. 10 Frigate Fuel). Gek hoppers are double size.
  - You can be Overseer of up to four settlements at once, and collect from any teleport terminal.
