# Settlement production data (post-Beacon update).
# Source: "Settlement Math Part 4: Production of goods" by John Truck, Steam NMS General Discussion
# (Oct–Nov 2025), cross-checked against the Fandom wiki Planetary Settlement page.
# Accuracy pass, Nov 2026: trade goods renamed to their current names, Vector Compressors and Decommissioned Circuits
# (source: wiki item pages, "Waypoint - Renamed"; the Steam guide uses these names too).
# Batch times are no longer given as fixed durations: they vary with the settlement's productivity and maintenance cost.
# qty = items per batch. value = units per batch. gpt = Gek batch time in "Gek Production Time" units (relative: how long a
# batch really takes varies with the settlement's productivity and maintenance cost).

