# Companions & Holo-Arena (Xeno Arena, update 6.30+).
# Sources: official 6.30 patch notes (via community wiki); community wiki Egg Sequencer page and species pages;
# community guides (nomansskyrecipes.com, allthings.how, topgamerarena.com, vortexgaming.io), April–Aug 2026.
# The affinity chart is community-mapped from in-game matchup screens — sources disagree on some cells, so verify in game.

affinities: [Fire, Frost, Radioactive, Toxic, Tropical, Anomalous, Mechanical, Desert]

affinityInfo:
  Fire: {colour: "#e5603b", biome: Scorched / Volcanic (hot) planets, plant: Solanium}
  Frost: {colour: "#5aa9e6", biome: Frozen planets, plant: Frost Crystal}
  Radioactive: {colour: "#9bc53d", biome: Irradiated planets, plant: Gamma Root}
  Toxic: {colour: "#b05fc9", biome: Toxic planets, plant: Fungal Mould}
  Tropical: {colour: "#2fb36b", biome: Lush planets, plant: Star Bulb}
  Anomalous: {colour: "#e0a526", biome: Exotic / anomalous planets, plant: —}
  Mechanical:
    colour: "#8a94a6"
    biome: Robotic fauna (often uncharted/abandoned systems)
    plant: — (tame with Ion Battery)
  Desert: {colour: "#c9935a", biome: Barren (desert) planets, plant: Cactus Flesh}

# atk: deals extra damage to / reduced damage to.  def: takes reduced damage from / extra damage from.
chart:
  Fire: {atkStrong: Frost, atkWeak: Desert, defStrong: Anomalous, defWeak: Radioactive}
  Frost: {atkStrong: Mechanical, atkWeak: Radioactive, defStrong: Toxic, defWeak: Fire}
  Radioactive: {atkStrong: Fire, atkWeak: Toxic, defStrong: Frost, defWeak: Anomalous}
  Toxic: {atkStrong: Tropical, atkWeak: Frost, defStrong: Radioactive, defWeak: Desert}
  Tropical: {atkStrong: Anomalous, atkWeak: Mechanical, defStrong: Desert, defWeak: Toxic}
  Anomalous: {atkStrong: Radioactive, atkWeak: Fire, defStrong: Mechanical, defWeak: Tropical}
  Mechanical: {atkStrong: Desert, atkWeak: Anomalous, defStrong: Tropical, defWeak: Frost}
  Desert: {atkStrong: Toxic, atkWeak: Tropical, defStrong: Fire, defWeak: Mechanical}

stats:
  - {name: Agility, what: Turn order — the faster creature acts first. Small creatures also dodge more., priority: 1}
  - {name: Health, what: Hit points. Lets a creature survive long enough to land status effects. Large creatures are tankier but easier to hit., priority: 2}
  - {name: Combat Effectiveness, what: Scales the damage and strength of every ability., priority: 3}

classMeaning:
  - {cls: S, text: Highest growth ceiling — what you want for a main team.}
  - {cls: A, text: Strong; fine for most content.}
  - {cls: B, text: Usable when it covers an affinity you lack.}
  - {cls: C, text: Low ceiling — evolution can’t make up for it.}

temperaments:
  - {name: Independence, battle: "Chance to take an extra move on its own in a turn, ignoring that move’s cooldown. Worth raising on battlers.", confirmed: true}
  - {name: Devotion, battle: Opposite of Independence — no known battle bonus., confirmed: true}
  - {name: Aggression / Gentleness, battle: Battle effect not yet confirmed (players report aggressive creatures make more bonus attacks)., confirmed: false}
  - {name: Helpfulness / Playfulness, battle: Battle effect not yet confirmed., confirmed: false}

abilityKinds: ["Basic attack — reliable damage, no cooldown.", "Status attack — damage over time, stat reduction or stun.", "Power attack — big damage, but may miss or carry a long cooldown.", Heal or buff — restore health or boost your own stats., "Special — species-specific trick (shields, cleanse, morph the target’s affinity, delayed effects…)."]

arenaFacts:
  - Battles are 3 vs 3 and turn-based. Knock out all three opposing creatures to win. You can swap your active creature on your turn.
  - "Holo-Arena tables: Space Anomaly (other players), space stations (system champions — harder, better rewards), planetary outposts, archives and some settlement buildings (local aliens)."
  - "Start with Iteration: Oceanus on the Space Anomaly: a short tutorial plus two more fights unlock everything and give your first Retroviral Pellet. Oceanus also sets one daily challenge, the same for every player."
  - Affinity advantage is worth roughly ±30% damage. It usually matters more than class — a B-class creature with the right matchup beats an S-class on the wrong side.
  - Creatures level to 30 from battle XP. Each level gives a mutation point to spend on Agility, Health or Combat Effectiveness (each can be raised about 10 times); upgrades unlock in tiers.
  - Retroviral Pellets trigger an evolution immediately. Summon the creature you want first, then feed it the pellet.
  - "Use the Analysis Visor’s Creature Survey mode to see a wild creature’s battle classes before you adopt it. Companion slots: 2 free, then 500 nanites and rising (max 30)."
  - Arena League ranks (Catalogue & Guide) reward titles and five exclusive companions from Oceanus.

