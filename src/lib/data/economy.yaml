strengths:
  - level: Weak
    stars: 1
    names: [Declining, Destitute, Failing, Fledgling, Low Supply, Struggling, Unsuccessful, Unpromising]
    note: Fewer trade goods for sale, in smaller quantities. Mostly C-class ships.
  - level: Average
    stars: 2
    names: [Adequate, Balanced, Comfortable, Developing, Medium Supply, Promising, Satisfactory, Sustainable]
    note: A partial selection of trade goods.
  - level: Strong
    stars: 3
    names: [Advanced, Affluent, Booming, Flourishing, High Supply, Opulent, Prosperous, Wealthy]
    note: All five trade goods in the largest quantities. Best chance of A/S-class ships.

