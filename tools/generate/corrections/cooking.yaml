# Hand corrections for src/lib/data/cooking.yaml, applied by tools/generate/cooking.js on top of what it parses from
# the wiki "Cooking" page. Format: see tools/generate/lib/corrections.js. Most fix recipes the Cooking table gets
# wrong or incomplete, checked against each dish's own wiki page ({{Cook}} template).

# Ingredient spellings: every occurrence of `from` in a generated recipe becomes `to` (the generator stops if a
# rename no longer matches anything). In-game names checked against the wiki item pages and the game-text extract
# AssistantNMS assets/json/en/Fishing.lang.json (https://github.com/AssistantNMS/App), Nov 2026.
renames:
  - {from: Child Of Helios, to: Child of Helios, why: Wiki Cooking table capitalises "Of"; the item page and game text are "Child of Helios".}
  - {from: Jelly Of The Veil, to: Jelly of the Veil, why: Wiki Cooking table misspells Jelly of the Veil; the item page and game text are "Jelly of the Veil".}
  - {from: Mellitluous Jellyfish, to: Mellifluous Jellyfish, why: Wiki Cooking table misspells Mellifluous Jellyfish; the item page is "Mellifluous Jellyfish".}
  - {from: Atlandidian Crab, to: Atlantidian Crab, why: Wiki Cooking table misspells Atlantidian Crab; the item page is "Atlantidian Crab".}
  - {from: Giant Whiskerfin, to: Giant Whiskerfish, why: Wiki Cooking table misspells Giant Whiskerfish; the item page is "Giant Whiskerfish".}
  - {from: HelionBass, to: Hellion Bass, why: "Wiki Cooking table misspells Hellion Bass (no page under either spelling); the wiki Fish list, Nutrient Ingestor table and game text all have \"Hellion Bass\"."}
  - {from: Spartfin, to: Spratfin, why: "Wiki Cooking table misspells Spratfin (no page under either spelling); the wiki Fish list, Nutrient Ingestor table and game text all have \"Spratfin\"."}
  - {from: Quatzshell Crab, to: Quartzshell Crab, why: "Wiki Cooking table misspells Quartzshell Crab (no page under either spelling); the wiki Fish list, Nutrient Ingestor table and game text all have \"Quartzshell Crab\"."}
  - {from: Sulphyrfish, to: Sulphurfish, why: "Wiki Cooking table misspells Sulphurfish (no page under either spelling); the wiki Fish list, Nutrient Ingestor table and game text all have \"Sulphurfish\"."}
  - {from: Chalkscale Nibbler, to: Chalkscale Nibber, why: "No page under either spelling; the wiki Cooking table and Fish list say \"Nibbler\", but the game text and the Nutrient Ingestor table have \"Chalkscale Nibber\"."}
  - {from: Hyper-Cockle, to: Hyper-cockle, why: "No page under either spelling; the wiki Cooking table and Fish list say \"Hyper-Cockle\", but the game text and the Nutrient Ingestor table have \"Hyper-cockle\"."}

